# S0 合格提纲 · Anthropic 新规试点
# slug: anthropic-new-rule
# 来源：/workspace/anthropic-new-rule-script-2026-10-10/voiceover.md（2026-10-10 核验）
# 素材包：/workspace/anthropic-new-rule-assets-2026-10-10/
# 既有分镜参考：/workspace/guozhi-one-prompt-anthropic/01-storyboard.md（S1 可对照，勿照抄黄白人设）

title: "Anthropic 出了条新规"
hook: "先说清楚：这条视频的口播、画面、字幕，基本都是 AI 做的——但今天不聊怎么做视频，Anthropic 出了条新规。"
audience: "关注 AI 使用政策 / Claude 日常用法的小红书·抖音观众"
ending: "我是果汁，每天分享更多好用的 AI 知识。"

chapters:
  - id: c1
    title: "时间与核心条款"
    beats:
      - claim: "新规管的是「你怎么对待 Claude」，不只是拿它干什么"
        talk: "这次不光管你拿 Claude 干什么，还把「你怎么对待 Claude」写进了使用政策。"
        visual: "封面大字 + 关键词「怎么对待 Claude」"
      - claim: "10/8 公布，11/12 生效；持续无必要虐待或残酷对待模型算违规"
        talk: "10 月 8 日公布，11 月 12 日起生效。核心一句话：持续、无必要地虐待或残酷对待模型，算违规。"
        visual: "日期卡 + 核心条款卡（持续/无必要高亮）"
      - claim: "与霸凌他人、虐待动物写在同一节"
        talk: "有意思的是，这条跟禁止霸凌他人、禁止虐待动物，写在同一节。聊天框里的 AI，也被加进了这组条款。"
        visual: "同节对照卡"

  - id: c2
    title: "边界：还能不能批评"
    beats:
      - claim: "普通不满与返工不在本条限制内"
        talk: "比如你让它修 bug，说修好了却还报错，你回「这还没修好，重新检查」——这种不满和要求返工，不在这一条的限制范围里。"
        visual: "报错示意 + 排除项卡（普通不满）"
      - claim: "黑暗创作、反驳、测试研究也被排除；其他规则仍适用"
        talk: "黑暗小说、普通反驳、模型测试和研究，都不是本条要管的。当然，其他使用规则仍然适用。"
        visual: "排除项卡勾出创作/反驳/测试"

  - id: c3
    title: "完整定义与执行"
    beats:
      - claim: "针对极端：无目的却反复残酷对待；持续+无必要一起看"
        talk: "官方完整说法是虐待或残酷对待模型。针对极端情况——看不出有什么目的，却反复、残酷地对待模型。「持续」和「无必要」要一起看。"
        visual: "核心条款卡 + 极端情况卡"
      - claim: "主要处理是结束对话，≠ 封号；公告未给次数阈值"
        talk: "真到了这种情况，Claude 主要是结束当前对话。结束聊天和封号不能画等号；公告也没有给出骂几句、持续多久就算违规的数字。"
        visual: "执行方式卡 +「≠ 封号」字幕"
      - claim: "结束对话能力 2025-08 已有；这次补的是政策明文"
        talk: "结束对话能力 2025 年 8 月就有了。设计是先引导，多次没用才停。这次补上的，是使用政策里的明确限制。"
        visual: "结束对话历史卡：引导→再引导→停"

  - id: c4
    title: "案例：刑房与 Pain Axis"
    beats:
      - claim: "AI 刑房是开放权重本地干预，≠ Claude 聊天；非新规起因"
        talk: "公开项目「AI 刑房」在本地开放权重模型上人为干预内部状态。作者未证明模型真受苦；跟 Claude 聊天框不是同一种操作；官方也没把它列为更新原因。"
        visual: "刑房事实卡 + 护栏字幕「非新规起因」"
      - claim: "Pain Axis：特定条件下注入可改行为（0%→75%、94%），未证主观疼痛"
        talk: "《The Pain Axis》在特定微调+注入条件下，删除按钮选择从 0% 到 75%，对照垃圾邮件时到 94%。这是描述性按钮，不能套到普通 Qwen 或 Claude；也未证明模型主观上真的疼。"
        visual: "双按钮示意 + 大数字动画 + 护栏小字"
      - claim: "无注入自然语境 0/560；便秘插曲仅为开发者报告"
        talk: "无注入、只用自然语境侮辱时，560 次里一次没选删除按钮。便秘语料那则是开发者报告，未独立复现——第一人称「我难受」和真有体验要分开验证。"
        visual: "0/560 数字卡 + Tom's Guide 卡"

  - id: c5
    title: "背景与同批其他规则"
    beats:
      - claim: "Anthropic 福祉研究承认意识无科学共识；微软对照早于新规"
        talk: "Anthropic 2025 年就有模型福祉研究计划，并承认 AI 有没有意识尚无科学共识。微软负责人 2026-09 批评过拟人化路线——那是草案背景对照，早于这次新规。"
        visual: "福祉卡 + 微软背景卡（标注早于新规）"
      - claim: "同批还有宣传/选举/武器/监控/执法/硬件/政府客户等规则"
        talk: "这轮不只有「别虐待 Claude」：欺骗性宣传、选举假消息、武器制导、未经同意追踪、执法决策建议、可伤人硬件的急停要求、政府客户另行约定等，很多是把旧规则写得更明确。"
        visual: "其他规则卡分条上屏"

  - id: c6
    title: "日常建议与收束"
    beats:
      - claim: "建议一：别只说「重做」，给具体报错"
        talk: "下面是使用建议，不是官方礼貌条款。别只回「重做」——可以说预期 200、实际 500、日志在下面，先检查这个报错。"
        visual: "弱反馈 vs 具体反馈对比卡"
      - claim: "建议二：要验收证据，别只问「你确定吗」"
        talk: "它说全部完成时，直接要「把测试跑一遍，把结果给我看」。是否完成看证据，跟语气温不温柔是两件事。"
        visual: "字幕「把测试结果给我看」"
      - claim: "普通批评仍可；极端持续无必要残酷才受约束；阈值未量化"
        talk: "普通批评和纠错仍然可以；极端、持续、无必要的残酷互动会受约束。持续多久、重复多少次算违规，公告还没有数字，得看后续执行。"
        visual: "边界收束卡 +「阈值未给出」"

